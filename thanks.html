<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message sent — Juan Pablo Osorio Rivera</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23181818'/><text x='50' y='72' font-family='Georgia,serif' font-size='62' fill='%23faf8f4' text-anchor='middle'>J</text></svg>">
<script data-goatcounter="https://garasnote.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
  :root {
    --paper: #fbf9f5; --ink: #191713; --muted: #6b655c; --rule: #e3ddd2; --accent: #9c3b12;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12110f; --ink: #eeeae3; --muted: #a39c90; --rule: #2b2823; --accent: #e0805a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    background: var(--paper); color: var(--ink); font: 400 17px/1.62 var(--sans);
  }
  .wrap { max-width: 38rem; margin: 0 auto; padding: 3rem 1.5rem; }
  p.eyebrow {
    font: 600 .72rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 1.6rem;
  }
  h1 { font: 400 clamp(1.9rem, 5vw, 2.7rem)/1.08 var(--serif); letter-spacing: -.02em; margin: 0 0 1rem; }
  p { color: var(--muted); margin: 0 0 1rem; }
  a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: .18em; }
  a:hover { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0 1.4rem; }
  .back { font: 600 .8rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Message sent</p>
    <h1>Thank you — it reached my inbox.</h1>
    <p>I read everything that comes through this form and usually reply within a day or two. If it is
    urgent, write to me directly at <a href="mailto:jp.osorio4102@gmail.com">jp.osorio4102@gmail.com</a>.</p>
    <hr>
    <p><a class="back" href="/">&larr; Back to the site</a></p>
  </div>
</body>
</html>
